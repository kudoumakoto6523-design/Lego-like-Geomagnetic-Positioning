[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geomagnetic-positioning-ddtw"
version = "0.1.0"
description = "Geomagnetic + IMU fusion experiments with PF/DDTW on UJIIndoorLoc-Mag."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "pykrige>=1.7",
  "matplotlib>=3.7",
  "gstools",
  "bokeh>=3.4"
]

[tool.map_builder]
preview_resolution = 1.0
max_kriging_points = 2500
seed = 42
variogram_model = "spherical"
output_model_npz = "data/processed/uji_mag_model_kriging.npz"
output_preview_npz = "data/processed/uji_mag_grid_preview_kriging.npz"
output_json = "data/processed/uji_mag_grid_kriging_meta.json"
output_png = "data/processed/uji_mag_grid_kriging.png"

[tool.outdoor_map_builder]
data_root = "data/raw/outdoor_rtk_map"
output_dir = "data/processed/outdoor_rtk_map"
cell_size_m = 0.15
grid_spacing_m = 0.10
variogram_model = "exponential"
variogram_nlags = 12
variogram_weight = true
kriging_pseudo_inverse = true
max_rtk_interpolation_gap_s = 0.5
rtk_window_margin_s = 2.0
required_fix_quality = [4]
color_percentiles = [1.0, 99.0]

[tool.setuptools.packages.find]
include = ["Geomag*"]
exclude = ["data*", "tests*"]
